[package]
name = "yokisfy-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "stream", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
rodio = { version = "0.20", default-features = false, features = ["cpal-shared-stdcxx"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4", "alac"] }
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
thiserror = "2"
urlencoding = "2"
rand = "0.8"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
md-5 = "0.10"
bore-cli = { version = "0.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(target_os = "android")'.dependencies]
oboe = "0.6"
