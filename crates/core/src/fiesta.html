<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiesta · Yokisfy</title>
<style>
:root{color-scheme:dark;--bg:#000;--tx:#fff;--tx2:#9a9a9f;--line:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;background:#000d;backdrop-filter:blur(12px);padding:18px 16px 12px;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.03em;display:flex;gap:10px;align-items:center}
h1 svg{width:30px;height:30px}
p.sub{margin:0 0 12px;color:var(--tx2);font-size:14px}
.now{display:flex;gap:12px;align-items:center;margin:0 0 12px}
.now img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#111}
.now b{display:block}
.now span{color:var(--tx2);font-size:13px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0d0d0f;color:var(--tx);font:inherit}
input:focus{outline:2px solid #fff}
ul{list-style:none;margin:0;padding:8px 8px 40px}
li{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px}
li img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#111;flex:none}
li div{flex:1;min-width:0}
li b,li span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li span{color:var(--tx2);font-size:13px}
button{border:0;border-radius:999px;padding:9px 14px;background:#fff;color:#000;font:600 14px system-ui;cursor:pointer;flex:none}
button:disabled{background:#333;color:#aaa}
.name{display:flex;gap:8px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
.off{padding:40px 20px;text-align:center;color:var(--tx2)}
.listen{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.listen button{display:flex;gap:8px;align-items:center}
.listen button.on{background:#1f1f22;color:#fff;outline:1px solid #444}
.listen input{flex:1;accent-color:#fff;padding:0;border:0;background:none}
.listen small{color:var(--tx2);font-size:12px;white-space:nowrap}
#ytw{display:none;margin:0 0 12px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#111}
#ytw.on{display:block}
#ytw iframe,#ytw div{width:100%;height:100%;border:0}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 64 64"><path d="M8 36h8l4-9 6 18 6-26 5 17h18M49 30v14" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Fiesta</h1>
  <p class="sub" id="host">Escucha lo mismo que suena y agrega canciones a la cola.</p>
  <div class="now" id="now" hidden><img id="nowImg" alt=""><div><b id="nowT"></b><span id="nowA"></span></div></div>
  <div class="listen"><button id="lis"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg><span>Escuchar aquí</span></button><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen" hidden><small id="sync"></small></div>
  <div id="ytw"><div id="yt"></div></div>
  <audio id="au" preload="auto"></audio>
  <div class="name"><input id="who" placeholder="Tu nombre" maxlength="24" autocomplete="name"></div>
  <input id="q" type="search" placeholder="Busca una canción" autocomplete="off">
</header>
<ul id="list"></ul>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id)
const who = $('who')
who.value = localStorage.getItem('yk-who') || ''
who.oninput = () => localStorage.setItem('yk-who', who.value)
const call = (a, body) => fetch('/yk/' + a, body ? { method: 'POST', body: JSON.stringify(body) } : {}).then((r) => r.json())
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2200) }
async function now() {
  try {
    const n = await call('party_now')
    if (!n.on) { $('list').innerHTML = '<li class="off">La fiesta está cerrada. Pídele al anfitrión que la abra en Yokisfy.</li>'; return }
    $('host').textContent = `Estás en la fiesta de ${n.name}. Escucha con ellos y agrega canciones a la cola.`
    if (n.track) { $('now').hidden = false; $('nowImg').src = n.track.cover || ''; $('nowT').textContent = n.track.title; $('nowA').textContent = n.track.artist }
  } catch {}
}
let timer
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(search, 350) }
async function search() {
  const q = $('q').value.trim()
  if (!q) return ($('list').innerHTML = '')
  const r = await call('party_search', { q })
  const ul = $('list')
  ul.innerHTML = ''
  for (const t of r.tracks || []) {
    const li = document.createElement('li')
    li.innerHTML = `<img alt="" src="${t.cover || ''}"><div><b></b><span></span></div><button>Agregar</button>`
    li.querySelector('b').textContent = t.title
    li.querySelector('span').textContent = t.artist
    li.querySelector('button').onclick = async (e) => {
      e.target.disabled = true
      const res = await call('party_add', { track: t, from: who.value.trim() || 'Alguien' })
      e.target.textContent = res.ok ? 'En la cola' : 'No se pudo'
      if (res.ok) toast(`Agregada: ${t.title}`)
    }
    ul.appendChild(li)
  }
}
let on = false, cur = null, yt = null, ytReady = null, busy = false, kind = null
const au = $('au'), vol = $('vol')
vol.value = localStorage.getItem('yk-vol') || '0.8'
vol.oninput = () => { localStorage.setItem('yk-vol', vol.value); au.volume = +vol.value; if (yt && yt.setVolume) yt.setVolume(Math.round(vol.value * 100)) }
function loadYT() {
  if (ytReady) return ytReady
  ytReady = new Promise((res) => {
    window.onYouTubeIframeAPIReady = () => { yt = new YT.Player('yt', { playerVars: { playsinline: 1, rel: 0, controls: 0 }, events: { onReady: () => res(yt) } }) }
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s)
  })
  return ytReady
}
function mine() { return kind === 'yt' ? (yt && yt.getCurrentTime ? yt.getCurrentTime() : 0) : au.currentTime }
async function sync() {
  if (!on || busy) return
  busy = true
  try {
    const t0 = performance.now()
    const n = await call('party_now')
    const half = (performance.now() - t0) / 2000
    if (!n.on) { stop(); return }
    if (!n.track || !n.src) { $('sync').textContent = 'Nada sonando'; return }
    const target = n.position + (n.playing && !n.loading ? half : 0)
    if (n.track.id !== cur) {
      cur = n.track.id
      if (n.src.yt) {
        kind = 'yt'; au.pause(); $('ytw').classList.add('on')
        const p = await loadYT()
        p.setVolume(Math.round(vol.value * 100))
        p.loadVideoById({ videoId: n.src.yt, startSeconds: target + 1 })
      } else {
        kind = 'au'; $('ytw').classList.remove('on'); if (yt && yt.stopVideo) yt.stopVideo()
        au.src = n.src.audio; au.volume = +vol.value
        au.addEventListener('loadedmetadata', () => { au.currentTime = target + (performance.now() - t0) / 1000 }, { once: true })
        if (n.playing) au.play().catch(() => {})
      }
      $('sync').textContent = 'Cargando…'
      return
    }
    const d = mine() - target
    const paused = kind === 'yt' ? (yt && yt.getPlayerState && yt.getPlayerState() !== 1) : au.paused
    if (n.playing && paused) { kind === 'yt' ? yt.playVideo() : au.play().catch(() => {}) }
    if (!n.playing && !paused) { kind === 'yt' ? yt.pauseVideo() : au.pause() }
    if (n.playing && Math.abs(d) > 1.2) { kind === 'yt' ? yt.seekTo(target + 0.4, true) : (au.currentTime = target + 0.2) }
    if (kind === 'au') au.playbackRate = n.playing && Math.abs(d) > 0.15 && Math.abs(d) <= 1.2 ? Math.min(1.06, Math.max(0.94, 1 - d * 0.08)) : 1
    $('sync').textContent = n.playing ? (Math.abs(d) > 1.2 ? 'Ajustando…' : 'En sincronía') : 'En pausa'
  } catch { $('sync').textContent = 'Reconectando…' } finally { busy = false }
}
function stop() { on = false; cur = null; au.pause(); if (yt && yt.stopVideo) yt.stopVideo(); $('ytw').classList.remove('on'); $('lis').classList.remove('on'); $('lis').querySelector('span').textContent = 'Escuchar aquí'; vol.hidden = true; $('sync').textContent = '' }
$('lis').onclick = () => {
  if (on) return stop()
  on = true; $('lis').classList.add('on'); $('lis').querySelector('span').textContent = 'Dejar de escuchar'; vol.hidden = false
  au.play().catch(() => {}); au.pause()
  sync()
}
setInterval(sync, 2000)
now(); setInterval(now, 8000)
</script>
</body>
</html>
