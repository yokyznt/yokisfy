[package]
name = "yokisfy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Reproductor y descargador de música libre"

[lib]
name = "yokisfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
rand = "0.8"
urlencoding = "2"
futures-util = "0.3"
yokisfy-core = { path = "../crates/core" }
tauri-plugin-yk-media = { path = "plugins/yk-media" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_WinRT", "Win32_System_Diagnostics_ToolHelp"] }
